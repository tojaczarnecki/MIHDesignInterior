<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Selected project by MIH Design." />
    <title>Projekt — MIH Design</title>
    <link rel="icon" type="image/webp" href="../assets/brand/mih-favicon.webp" />
    <link rel="stylesheet" href="villa-aurora/project.css" />
    <style>
      .project-placeholder { min-height: 100svh; display: grid; place-items: center; padding: 8rem var(--pad); text-align: center; background: var(--ink); }
      .brand-mark { width: clamp(8.8rem, 13vw, 12rem); height: auto; }
      .brand-mark img { display: block; width: 100%; height: auto; }
      .project-placeholder-inner { max-width: 52rem; }
      .project-placeholder h1 { margin: 0; font: 400 clamp(3.5rem, 10vw, 9rem)/.92 var(--serif); letter-spacing: -.05em; }
      .project-placeholder h1 em { color: var(--stone); font-style: normal; }
      .project-placeholder-image { display: block; width: min(100%, 48rem); max-height: 58vh; margin: 3rem auto 2rem; object-fit: cover; aspect-ratio: 4 / 5; }
      .project-placeholder-meta { color: var(--muted); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; }
      .project-placeholder-copy { max-width: 30rem; margin: 2rem auto 3rem; color: var(--muted); font: 400 1.2rem/1.4 var(--serif); }
      .project-header .menu-toggle { display: none; }
      @media (max-width: 900px) { .project-header .menu-toggle { display: flex; } }
      @media (max-width: 600px) { .project-placeholder { padding: 7rem var(--pad) 4rem; } .project-placeholder-image { max-height: 48vh; } }
    </style>
    <style>
      .project-header { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem var(--pad); border-bottom: 1px solid rgba(247,244,237,.3); }
      .project-header .header-context, .project-header .desktop-nav, .project-header .header-cta { display: none !important; }
      .project-header .brand-mark { width: clamp(8.8rem, 13vw, 12rem); height: auto; }
      .project-header .menu-toggle { display: flex; position: relative; z-index: 31; width: 2.8rem; height: 2.8rem; }
      .project-menu-language { display: flex; align-items: center; gap: .4rem; margin-top: 2rem; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; }
      .project-menu-language button { padding: .3rem 0; border: 0; background: none; color: inherit; cursor: pointer; opacity: .48; }
      .project-menu-language button.is-active { opacity: 1; }
      .project-menu-language span { opacity: .48; }
      .mobile-menu { position: fixed; z-index: 30; inset: 0; display: flex; align-items: center; padding: 7rem var(--pad) 3rem; border-top: 1px solid rgba(247,244,237,.22); background: var(--ink); transform: translateY(-100%); transition: transform .5s cubic-bezier(.7,0,.2,1); }
      .mobile-menu.is-open { transform: none; }
      :root { --ink: #151411; --ivory: #f7f4ed; --paper: #f7f4ed; --stone: #8b8174; }
      .project-placeholder, .project-footer { background: #151411; color: #f7f4ed; }
      .project-placeholder h1 em { color: #777777; }
      .project-placeholder-image { filter: none; }
      @media (min-width: 901px) {
        .header-context { grid-area: spacer; justify-self: start; color: rgba(247,244,237,.58); font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; }
        .project-header { grid-template-columns: 1fr auto 1fr; grid-template-areas: "spacer logo actions" "nav nav nav"; row-gap: 1rem; }
        .project-header .brand-mark { grid-area: logo; justify-self: center; }
        .project-header .header-cta { display: none; }
        .project-header .desktop-nav { grid-area: nav; justify-content: center; padding-top: .8rem; border-top: 1px solid rgba(255,255,255,.24); }
      }
      @media (max-width: 900px) {
        .header-context { display: none; }
        .project-header { grid-template-columns: 1fr auto auto; grid-template-areas: "logo actions menu"; }
        .project-header .brand-mark { grid-area: logo; justify-self: start; }
        .project-header .menu-toggle { grid-area: menu; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#content">Przejdź do treści</a>
    <header class="project-header">
      <span class="header-context" aria-hidden="true">MIH / Atelier</span>
      <a class="brand-mark" href="../index.html#top" aria-label="MIH Design — strona główna"><img src="../assets/brand/mih-logo-white.webp" alt="MIH Design" /></a>
      <nav class="desktop-nav" aria-label="Główna nawigacja"><a href="../index.html#studio">Studio</a><a href="../index.html#projects">Projekty</a><a href="../index.html#services">Usługi</a><a href="../index.html#journal">Journal</a><a href="../index.html#collection">Sklep</a></nav>
      <a class="header-cta" href="../brief/">Przedstaw projekt <span>↗</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Otwórz menu" data-menu-toggle><span></span><span></span></button>
    </header>
    <div class="mobile-menu" id="mobile-menu" aria-hidden="true" data-mobile-menu>
      <button class="mobile-menu-close" type="button" aria-label="Zamknij menu" data-menu-close><span></span><span></span></button>
      <nav aria-label="Nawigacja mobilna">
        <a href="../index.html#studio">Studio</a><a href="../index.html#projects">Projekty</a><a href="../index.html#services">Usługi</a><a href="../index.html#journal">Journal</a><a href="../index.html#collection">Sklep</a><a href="../brief/">Przedstaw projekt</a><div class="project-menu-language" aria-label="Wybierz język"><button type="button" class="is-active">PL</button><span>/</span><button type="button">EN</button></div>
      </nav>
    </div>
    <main id="content"><section class="project-placeholder"><div class="project-placeholder-inner"><p class="eyebrow">MIH DESIGN / SELECTED WORK</p><h1 id="project-title">Projekt</h1><img id="project-image" class="project-placeholder-image" src="../assets/projects/villa-aurora.jpg" alt="" /><p id="project-meta" class="project-placeholder-meta"></p><p id="project-copy" class="project-placeholder-copy"></p><a class="text-link" href="../index.html#projects">← Wszystkie projekty</a></div></section></main>
    <footer class="project-footer"><div class="container footer-line"><a href="../index.html#top"><img src="../assets/brand/mih-logo-white.webp" alt="MIH Design" /></a><span>Warsaw · London · Worldwide</span><span>© 2026 MIH Design</span></div></footer>
    <script src="project-index.js"></script>
  </body>
</html>
